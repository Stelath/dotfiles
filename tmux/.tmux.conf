# Portable tmux config for macOS and Linux dev pods.

set -g mouse on
set -g history-limit 100000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# 1-based indexes, renumber on close.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Snappier escapes for vim/nvim.
set -sg escape-time 10
setw -g mode-keys vi

# Intuitive splits that keep the current path.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload config.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Plugins (installed by install.sh via tpm; prefix + I to fetch).
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

if-shell "[ -d ~/.tmux/plugins/tpm ]" "run '~/.tmux/plugins/tpm/tpm'"
